<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Trinchera — Propuestas de carta digital</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            background: #f4eee6;
            color: #25211e;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 700px;
            text-align: center;
        }

        .brand {
            margin-bottom: 45px;
        }

        .brand h1 {
            margin: 0 0 10px;
            font-size: clamp(2rem, 6vw, 3.5rem);
            letter-spacing: 0.04em;
        }

        .brand p {
            margin: 0;
            font-size: 1rem;
            opacity: 0.7;
        }

        .options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .option {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 180px;
            padding: 30px 20px;
            border: 1px solid rgba(37, 33, 30, 0.2);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.55);
            color: inherit;
            text-decoration: none;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .option:hover {
            transform: translateY(-4px);
            background: #fff;
        }

        .option span {
            margin-bottom: 12px;
            font-size: 0.75rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            opacity: 0.6;
        }

        .option strong {
            font-size: 1.3rem;
        }

        @media (max-width: 600px) {
            .options {
                grid-template-columns: 1fr;
            }

            .option {
                min-height: 140px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <header class="brand">
            <h1>La Trinchera</h1>
            <p>Propuestas de diseño para carta digital</p>
        </header>

        <section class="options">

            <a class="option" href="./v1.html">
                <span>Propuesta 01</span>
                <strong>Diseño uno</strong>
            </a>

            <a class="option" href="./v2/">
                <span>Propuesta 02</span>
                <strong>Diseño dos</strong>
            </a>

        </section>

    </main>

</body>
</html>
