<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Trinchera — Propuestas de carta digital</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 30px 20px 0;
            background: #f4eee6;
            color: #25211e;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 700px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin: 0 auto;
            text-align: center;
        }

        .brand {
            margin-bottom: 45px;
        }

        .brand h1 {
            margin: 0 0 10px;
            font-size: clamp(2rem, 6vw, 3.5rem);
            letter-spacing: 0.04em;
        }

        .brand p {
            margin: 0;
            font-size: 1rem;
            opacity: 0.7;
        }

        .options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .option {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 180px;
            padding: 30px 20px;
            border: 1px solid rgba(37, 33, 30, 0.2);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.55);
            color: inherit;
            text-decoration: none;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .option:hover {
            transform: translateY(-4px);
            background: #fff;
        }

        .option span {
            margin-bottom: 12px;
            font-size: 0.75rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            opacity: 0.6;
        }

        .option strong {
            font-size: 1.3rem;
        }

        /* FOOTER */

        .site-footer {
            width: 100%;
            margin-top: 50px;
            padding: 28px 20px 10px;
            text-align: center;
            border-top: 1px solid rgba(37, 33, 30, 0.12);
            color: #25211e;
        }

        .site-footer p {
            margin: 0 0 8px;
            font-size: 0.85rem;
            line-height: 1.6;
            opacity: 0.7;
        }

        .site-footer .designer-name {
            font-weight: 600;
            opacity: 0.9;
        }

        .site-footer .contact-links {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px 16px;
            margin-top: 8px;
        }

        .site-footer a {
            color: inherit;
            font-size: 0.8rem;
            text-decoration: none;
            opacity: 0.7;
            transition: opacity 0.2s ease;
        }

        .site-footer a:hover {
            opacity: 1;
            text-decoration: underline;
        }

        .site-footer .separator {
            opacity: 0.25;
        }

        @media (max-width: 600px) {

            body {
                padding: 20px 16px 0;
            }

            .options {
                grid-template-columns: 1fr;
            }

            .option {
                min-height: 140px;
            }

            .site-footer {
                margin-top: 40px;
                padding: 24px 16px 8px;
            }

            .site-footer .contact-links {
                gap: 6px 12px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <header class="brand">
            <h1>La Trinchera</h1>
            <p>Propuestas de diseño para carta digital</p>
        </header>

        <section class="options">

            <a class="option" href="./v1.html">
                <span>Propuesta 01</span>
                <strong>Diseño uno</strong>
            </a>

            <a class="option" href="./v2/">
                <span>Propuesta 02</span>
                <strong>Diseño dos</strong>
            </a>

        </section>

    </main>

    <footer class="site-footer">

        <p>
            Diseño y desarrollo web por
            <span class="designer-name">Emiliana Amaro</span>
        </p>

        <p>
            Diseño de carta digital · Desarrollo Frontend
        </p>

        <div class="contact-links">

            <a href="mailto:emilianamaro@hotmail.com">
                Email
            </a>

            <span class="separator">·</span>

            <a href="https://www.linkedin.com/in/emiamaro/"
               target="_blank"
               rel="noopener noreferrer">
                LinkedIn
            </a>

            <span class="separator">·</span>

            <a href="https://emilianamaro.github.io/PF/"
               target="_blank"
               rel="noopener noreferrer">
                Portfolio
            </a>

        </div>

    </footer>

</body>
</html>
